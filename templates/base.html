{% load static %}
<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AutoStock{% endblock %}</title>
    <script>
        // Aplica o tema salvo antes do paint (evita flash). Precisa ser inline.
        (function () {
            try {
                var t = localStorage.getItem("autostock-theme");
                if (t === "light" || t === "dark") {
                    document.documentElement.setAttribute("data-bs-theme", t);
                }
            } catch (e) {}
        })();
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/autostock.css' %}" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'dashboard' %}"><span class="brand-dot"></span>AutoStock</a>
            <div class="d-flex align-items-center">
                <button id="themeToggle" class="btn btn-outline-light btn-sm theme-toggle me-2" type="button"
                        aria-label="Alternar tema claro/escuro" title="Alternar tema claro/escuro">
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button>
                {% if user.is_authenticated %}
                    <span class="navbar-text me-3">{{ user.get_username }}</span>
                    <a class="btn btn-outline-light btn-sm" href="/admin/">Admin</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container-fluid py-4 px-lg-4">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script src="{% static 'js/theme.js' %}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
